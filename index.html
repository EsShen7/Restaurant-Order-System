<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Pavilion · Welcome</title>
  <link rel="stylesheet" href="css/customer.css">
  <style>
    /* ── Auth-specific layout ─────────────────────────── */
    html, body { height: 100%; }
    body {
      display: flex;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Left branding panel */
    .auth-brand {
      flex: 0 0 44%;
      background: linear-gradient(145deg, #0d0d18 0%, #14121e 60%, #0e0d16 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 64px 56px;
      position: relative;
      overflow: hidden;
      border-right: 1px solid rgba(201,168,76,.1);
    }
    .auth-brand::before {
      content: '';
      position: absolute;
      top: -110px; left: -110px;
      width: 420px; height: 420px;
      background: radial-gradient(circle, rgba(201,168,76,.07) 0%, transparent 65%);
      pointer-events: none;
    }
    .auth-brand::after {
      content: '';
      position: absolute;
      bottom: -80px; right: -60px;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(201,168,76,.05) 0%, transparent 65%);
      pointer-events: none;
    }
    .brand-tag {
      font-size: 11px; letter-spacing: .18em; color: var(--gold);
      text-transform: uppercase; margin-bottom: 24px; font-weight: 500;
    }
    .brand-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 58px; font-weight: 300; line-height: 1.08;
      margin-bottom: 28px; color: var(--white);
    }
    .brand-title em { color: var(--gold); font-style: italic; display: block; }
    .brand-desc {
      font-size: 15px; line-height: 1.85;
      color: rgba(255,255,255,.46); max-width: 340px; margin-bottom: 52px;
    }
    .brand-divider { width: 44px; height: 1px; background: var(--gold); opacity: .3; margin-bottom: 36px; }
    .brand-stats { display: flex; gap: 40px; }
    .bstat-n {
      font-family: 'Cormorant Garamond', serif;
      font-size: 30px; color: var(--gold); font-weight: 300;
    }
    .bstat-l { font-size: 11px; color: rgba(255,255,255,.38); margin-top: 4px; letter-spacing: .04em; }

    /* Right form panel */
    .auth-panel {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 48px 40px;
      background: #0e0e18;
      overflow-y: auto;
    }
    .auth-box { width: 100%; max-width: 400px; }

    /* Tabs */
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid rgba(255,255,255,.07);
      margin-bottom: 36px;
    }
    .auth-tab {
      flex: 1; padding: 14px 0; text-align: center;
      font-size: 14px; font-weight: 500; color: rgba(255,255,255,.4);
      cursor: pointer; border-bottom: 2px solid transparent;
      margin-bottom: -1px; transition: all .22s; user-select: none;
    }
    .auth-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

    .auth-form { display: none; }
    .auth-form.active { display: block; }

    /* Form fields */
    .fg  { margin-bottom: 18px; }
    .fl  {
      display: block; font-size: 11px; letter-spacing: .08em;
      color: rgba(255,255,255,.44); margin-bottom: 8px; text-transform: uppercase;
    }
    .fi  {
      width: 100%; padding: 13px 16px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 8px; color: var(--white);
      font-size: 14px; font-family: 'Inter', -apple-system, sans-serif;
      outline: none; transition: border-color .2s, background .2s;
    }
    .fi:focus { border-color: rgba(201,168,76,.5); background: rgba(201,168,76,.03); }
    .fi::placeholder { color: rgba(255,255,255,.2); }

    /* Submit button */
    .auth-btn {
      width: 100%; padding: 15px;
      background: linear-gradient(135deg, var(--gold) 0%, #a07830 100%);
      border: none; border-radius: 8px; color: #fff;
      font-size: 15px; font-weight: 600; font-family: 'Inter', -apple-system, sans-serif;
      cursor: pointer; margin-top: 8px; letter-spacing: .04em;
      transition: opacity .2s, transform .15s;
    }
    .auth-btn:hover { opacity: .85; transform: translateY(-1px); }
    .auth-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    .auth-msg {
      padding: 12px 16px; border-radius: 8px;
      font-size: 13px; line-height: 1.5; margin-top: 14px; display: none;
    }
    .auth-msg.show { display: block; }
    .auth-err { background: rgba(192,57,43,.12); border: 1px solid rgba(192,57,43,.28); color: #ef9a9a; }

    /* Responsive */
    @media (max-width: 720px) {
      body { flex-direction: column; overflow: auto; }
      .auth-brand { flex: none; padding: 40px 24px; border-right: none; border-bottom: 1px solid rgba(201,168,76,.1); }
      .brand-title { font-size: 40px; }
      .brand-stats { display: none; }
      .auth-panel { padding: 32px 20px; }
    }
  </style>
</head>
<body>

<!-- ── LEFT BRAND PANEL ────────────────────────── -->
<div class="auth-brand">
  <div class="brand-tag">Elevated Chinese Cuisine · Est. 2012</div>
  <h1 class="brand-title">Cloud <em>Pavilion</em></h1>
  <p class="brand-desc">
    Rooted in tradition, driven by innovation — experience fine Chinese cuisine
    where every dish is an act of artistry, and every visit becomes a memory.
  </p>
  <div class="brand-divider"></div>
  <div class="brand-stats">
    <div><div class="bstat-n">13+</div><div class="bstat-l">Years of Excellence</div></div>
    <div><div class="bstat-n">60+</div><div class="bstat-l">Signature Dishes</div></div>
    <div><div class="bstat-n">98%</div><div class="bstat-l">Guest Satisfaction</div></div>
  </div>
</div>

<!-- ── RIGHT FORM PANEL ────────────────────────── -->
<div class="auth-panel">
  <div class="auth-box">
    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-login" onclick="switchTab('login')">Sign In</div>
      <div class="auth-tab"        id="tab-reg"   onclick="switchTab('reg')">Create Account</div>
    </div>

    <!-- Login -->
    <div class="auth-form active" id="form-login">
      <div class="fg">
        <label class="fl">Email Address</label>
        <input class="fi" id="lgEmail" type="email" placeholder="your@email.com"
               onkeydown="if(event.key==='Enter') doLogin()">
      </div>
      <div class="fg">
        <label class="fl">Password</label>
        <input class="fi" id="lgPass" type="password" placeholder="Your password"
               onkeydown="if(event.key==='Enter') doLogin()">
      </div>
      <button class="auth-btn" id="btnLogin" onclick="doLogin()">Sign In</button>
      <div class="auth-msg auth-err" id="lgErr"></div>
    </div>

    <!-- Register -->
    <div class="auth-form" id="form-reg">
      <div class="fg">
        <label class="fl">Full Name</label>
        <input class="fi" id="rgName" type="text" placeholder="Your full name" maxlength="100">
      </div>
      <div class="fg">
        <label class="fl">Email Address</label>
        <input class="fi" id="rgEmail" type="email" placeholder="your@email.com">
      </div>
      <div class="fg">
        <label class="fl">Phone <span style="opacity:.45">(optional)</span></label>
        <input class="fi" id="rgPhone" type="tel" placeholder="11-digit mobile number" maxlength="11">
      </div>
      <div class="fg">
        <label class="fl">Password</label>
        <input class="fi" id="rgPass" type="password" placeholder="At least 6 characters"
               onkeydown="if(event.key==='Enter') doRegister()">
      </div>
      <button class="auth-btn" id="btnReg" onclick="doRegister()">Create Account</button>
      <div class="auth-msg auth-err" id="rgErr"></div>
    </div>
  </div>
</div>

<script>
/* ── Tab switch ── */
function switchTab(t) {
  document.querySelectorAll('.auth-tab').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.auth-form').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + t).classList.add('active');
  document.getElementById('form-' + t).classList.add('active');
}

/* ── API helper ── */
async function api(action, body) {
  const r = await fetch('api.php?action=' + encodeURIComponent(action), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  const j = await r.json();
  if (!j.success) throw new Error(j.error || 'Request failed.');
  return j;
}

function showErr(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg; el.classList.add('show');
}
function hideErr(id) { document.getElementById(id).classList.remove('show'); }

/* ── Login ── */
async function doLogin() {
  hideErr('lgErr');
  const email = document.getElementById('lgEmail').value.trim();
  const pass  = document.getElementById('lgPass').value;
  if (!email || !pass) { showErr('lgErr', 'Please fill in all fields.'); return; }
  const btn = document.getElementById('btnLogin');
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    await api('customer_login', { email, password: pass });
    location.href = 'home.html';
  } catch(e) {
    showErr('lgErr', e.message);
    btn.disabled = false; btn.textContent = 'Sign In';
  }
}

/* ── Register ── */
async function doRegister() {
  hideErr('rgErr');
  const name  = document.getElementById('rgName').value.trim();
  const email = document.getElementById('rgEmail').value.trim();
  const phone = document.getElementById('rgPhone').value.trim();
  const pass  = document.getElementById('rgPass').value;
  if (!name || !email || !pass) { showErr('rgErr', 'Please fill in all required fields.'); return; }
  if (pass.length < 6) { showErr('rgErr', 'Password must be at least 6 characters.'); return; }
  const btn = document.getElementById('btnReg');
  btn.disabled = true; btn.textContent = 'Creating account…';
  try {
    await api('customer_register', { full_name: name, email, phone, password: pass });
    location.href = 'home.html';
  } catch(e) {
    showErr('rgErr', e.message);
    btn.disabled = false; btn.textContent = 'Create Account';
  }
}

/* ── Redirect if already logged in ── */
(async () => {
  try {
    const r = await api('customer_check_auth');
    if (r.logged_in) location.replace('home.html');
  } catch(e) {}
})();
</script>
</body>
</html>
